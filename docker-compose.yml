version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: hirely-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hirely-ai

  backend:
    build: ./backend
    container_name: hirely-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/hirely-ai
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: hirely-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  mongo_data:
